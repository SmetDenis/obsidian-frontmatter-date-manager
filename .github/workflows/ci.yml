name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: make install
      - run: make format-check
      - run: make lint
      # Type-checks e2e specs/PO without launching Obsidian. The e2e RUN itself
      # is manual (needs a real Obsidian + a display), but its types must not
      # rot unnoticed between releases.
      - run: make typecheck-e2e
      - run: make test
      - run: make build
